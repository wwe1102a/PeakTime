<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" href="./output.css">
</head>
<body>
    <header class="bg-white shadow-sm">
        <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <a href = "index.html" class="text-2xl font-black text-blue-600">PeakTime</a>
            </div>
        </div>
    </header>

    <main class="flex-grow flex items-center justify-center px-4 py-12">
        <div class="bg-white p-8 rounded-2xl shadow-sm border border-gray-100 w-full max-w-md">
            
            <h2 class="text-2xl font-bold text-gray-800 mb-6 text-center">สร้างบัญชีผู้ใช้ใหม่</h2>

            <form class="space-y-4" onsubmit="return false;">
    
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Username</label>
                    <input id="username" maxlength="10" type="text" placeholder="ชื่อผู้ใช้งาน"
                           class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm">
                </div>

                
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                    <input id="password" maxlength="20" type="password" placeholder="••••••••"
                           class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm">
                </div>

               
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Confirm Password</label>
                    <input id="repassword" maxlength="20" type="password" placeholder="••••••••"
                           class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm">
                </div>

                
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                    <input id="email" maxlength="30" type="email" placeholder="name@example.com"
                           class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm">
                </div>

                
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">NickName</label>
                    <input id="nickname" maxlength="10" type="text" placeholder="ชื่อเล่น"
                           class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm">
                </div>

                
                <div class="pt-2">
                    <button id="registerBtn" type="button"
                            class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 px-4 rounded-lg shadow-sm transition duration-200 text-sm">
                        Register
                    </button>
                </div>
            </form>

            <p class="text-sm text-center text-gray-500 mt-6">
                มีบัญชีอยู่แล้ว? <a href="signin.html" class="text-blue-600 hover:underline font-medium">Sign In</a>
            </p>
        </div>
    </main>  
    <script src="register.js"></script>
</body>
</html>
