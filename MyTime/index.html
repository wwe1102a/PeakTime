<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PeakTime</title>
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js"></script>
    <link rel="stylesheet" href="./output.css">
    
</head>
<body>
    <header class="bg-white shadow-sm">
        <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <a href = "index.html" class="text-2xl font-black text-blue-600">PeakTime</a>
            </div>
            <nav id="authContainer" ul class="flex items-center space-x-3">
                    <li>
                        <a href="signin.html" class="text-gray-600 hover:text-blue-600 px-3 py-2 rounded-lg text-sm font-medium transition">
                            Sign In
                        </a>
                    </li>
                    <li>
                        <a href="register.html" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-medium shadow-sm transition">
                            Register
                        </a>
                    </li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="flex-grow max-w-7xl w-full mx-auto px-6 py-8 grid grid-cols-1 lg:grid-cols-4 gap-8">
        
        <div class="space-y-6">
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
                <h2 class="text-lg font-bold text-gray-800 mb-2">ยินดีต้อนรับสู่ PeakTime</h2>
                <p class="text-sm text-gray-500 mb-4">
                    ระบบจัดการตารางนัดหมายและจองเวลาออนไลน์ของคุณ เลือกวันที่ต้องการจองผ่านปฏิทินได้เลย</p>
                <div class="bg-blue-50 border-l-4 border-blue-600 p-3 rounded-r-lg text-xs text-blue-700">
                    คลิกที่ช่องวันเวลาในปฏิทินเพื่อสร้างนัดหมายใหม่
                </div>
            </div>

            
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
                <h3 class="text-sm font-bold text-gray-700 mb-3">สถานะการจองวันนี้</h3>
                <div class="space-y-3">
                    <div class="flex justify-between items-center text-sm">
                        <span class="text-gray-500">นัดหมายทั้งหมด</span>
                        <span class="font-bold text-gray-800">0 รายการ</span>
                    </div>
                </div>
            </div>
        </div>

        
        <div class="lg:col-span-3 bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
            <div id="calendar"></div>
        </div>
        
    </main>

    
    <footer class="bg-white border-t border-gray-100 py-4 text-center text-xs text-gray-400">
         for studing web Development.
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const authContainer = document.getElementById('authContainer');
            const isLoggedIn = localStorage.getItem('token');
            const nickname = localStorage.getItem('nickname') || localStorage.getItem('username') || 'ผู้ใช้งาน';

            if (isLoggedIn) {
                authContainer.innerHTML = `
                    <div class="flex items-center space-x-4">
                        <span class="text-gray-700 font-semibold text-sm">${nickname}</span>
                        <button id="logoutBtn" class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-lg text-sm font-medium shadow-sm transition">
                            ออกจากระบบ
                        </button>
                    </div>
                `;

                
                document.getElementById('logoutBtn').addEventListener('click', () => {
                    localStorage.removeItem('token');
                    localStorage.removeItem('nickname');
                    window.location.reload(); 
                });
            } else {
               
                authContainer.innerHTML = `
                    <ul class="flex items-center space-x-3">
                        <li>
                            <a href="signin.html" class="text-gray-600 hover:text-blue-600 px-3 py-2 rounded-lg text-sm font-medium transition">
                                Sign In
                            </a>
                        </li>
                        <li>
                            <a href="register.html" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-medium shadow-sm transition">
                                Register
                            </a>
                        </li>
                    </ul>
                `;
            }
        });
    </script>

    <script src="calendar.js"></script>
    

</body>
</html>
