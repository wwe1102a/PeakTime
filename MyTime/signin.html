<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign-In</title>
    <link rel="stylesheet" href="./output.css">
</head>
<body>
    <header class="bg-white shadow-sm">
        <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <a href = "index.html" class="text-2xl font-black text-blue-600">PeakTime</a>
            </div>
        </div>
    </header>

    <main class="flex-grow flex items-center justify-center px-4 py-12">
        <div class="bg-white p-8 rounded-2xl shadow-sm border border-gray-100 w-full max-w-md">
            
            <h2 class="text-2xl font-bold text-gray-800 mb-6 text-center">เข้าสู่ระบบ</h2>

            <form id="loginForm" class="space-y-4" onsubmit="return false;">
                
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Username</label>
                    <input id="username" maxlength="30" type="text" placeholder="ชื่อผู้ใช้งาน"
                           class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm">
                </div>

                
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                    <input id="password" maxlength="20" type="password" placeholder="••••••••"
                           class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm">
                </div>

                
                <div class="pt-2">
                    <button id="signInBtn" type="submit"
                            class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 px-4 rounded-lg shadow-sm transition duration-200 text-sm">
                        Sign In
                    </button>
                </div>
            </form>

            
            <div class="mt-6 text-center">
                <p class="text-sm text-gray-500">
                    ยังไม่มีบัญชีใช่ไหม? 
                    <a href="register.html" class="text-blue-600 hover:underline font-medium ml-1">Register Here!</a>
                </p>
            </div>
        </div>
    </main>
    <script src="signin.js"></script>
</body>
</html>
